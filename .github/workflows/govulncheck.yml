name: govulncheck

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # Weekly run on Mondays at 07:23 UTC to surface new advisories that
    # may affect a tagged release even when no code changes land.
    - cron: '23 7 * * 1'
  # Allows the go-version-bump workflow (and humans) to start a run on a
  # branch whose push came from GITHUB_TOKEN and so triggered no workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
