name: Lint

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  # Allows the go-version-bump workflow (and humans) to start a run on a
  # branch whose push came from GITHUB_TOKEN and so triggered no workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin to a known-good release of golangci-lint so the lint rules
          # don't silently change underneath us. The default linter set
          # (errcheck, gosimple, govet, ineffassign, staticcheck, unused)
          # is sufficient for this codebase.
          version: v2.12.2
          args: --timeout=5m
